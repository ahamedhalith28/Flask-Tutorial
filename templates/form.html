<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Submit Data</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; }
    .error { color: #b00020; background: #ffe5e5; border: 1px solid #f5c2c7; padding: 12px; margin-bottom: 20px; }
    label { display: block; margin-top: 16px; font-weight: 600; }
    input { width: 100%; padding: 10px; margin-top: 6px; box-sizing: border-box; }
    button { margin-top: 20px; padding: 10px 18px; font-size: 16px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Enter data</h1>
  {% if error %}
    <div class="error">{{ error }}</div>
  {% endif %}
  <form method="post" action="{{ url_for('home') }}">
    <label for="name">Name</label>
    <input id="name" name="name" type="text" required>

    <label for="age">Age</label>
    <input id="age" name="age" type="number" min="0" required>

    <button type="submit">Submit</button>
  </form>
</body>
</html>
